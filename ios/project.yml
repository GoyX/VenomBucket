name: Horizon
options:
  bundleIdPrefix: dev.venombucket
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.venombucket.client
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PLATFORM_DIR)/Developer/Library/Frameworks"
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libhorizon_client.a"
          - "-framework Metal"
          - "-framework UIKit"
          - "-framework QuartzCore"
          - "-framework CoreAudio"
          - "-framework AudioToolbox"
          - "-framework AVFoundation"
          - "-framework CoreGraphics"
          - "-framework Foundation"
          - "-framework CoreFoundation"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: VenomBucket
        CFBundleName: VenomBucket
        CFBundleIdentifier: dev.venombucket.client
        CFBundleExecutable: Horizon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.games
        MinimumOSVersion: "15.0"
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiredDeviceCapabilities:
          - arm64
          - metal
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSHumanReadableCopyright: "MIT licensed. Not an official Minecraft product."