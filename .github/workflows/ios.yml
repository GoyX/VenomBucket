name: Build Horizon iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # 1. Cache Rust Dependencies and Build Artifacts (Saves ~8-10 mins)
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-build
          
      - name: Build Rust Static Library
        run: |
          cargo build --release --lib --package horizon-client --target aarch64-apple-ios --no-default-features --features audio
          
      # 2. Cache the Game Assets so we don't redownload 400MB every time (Saves ~2-3 mins)
      - name: Cache Game Assets
        id: cache-assets
        uses: actions/cache@v4
        with:
          path: ios/GameData
          key: horizon-assets-v1

      - name: Download Game Assets
        if: steps.cache-assets.outputs.cache-hit != 'true'
        run: |
          curl -L -o assets.zip "https://pub-7a7e79921dcf455280d0de7c4a48369f.r2.dev/horizon-assets.zip"
          mkdir -p ios/GameData
          unzip -q assets.zip -d ios/GameData/
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          
      - name: Build Xcode App (Unsigned)
        run: |
          cd ios
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build build
          
      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Horizon.app build/Payload/
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier dev.venombucket.client" build/Payload/Horizon.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Horizon" build/Payload/Horizon.app/Info.plist
          
          echo -n "APPL????" > build/Payload/Horizon.app/PkgInfo
          
          xattr -cr build/Payload/Horizon.app
          
          rm -rf build/Payload/__MACOSX
          find build/Payload -name "._*" -type f -delete
          
          find build/Payload -type d -exec chmod 755 {} \;
          find build/Payload -type f -exec chmod 644 {} \;
          chmod 755 build/Payload/Horizon.app/Horizon
          
          cd build
          zip -r -X Horizon-unsigned.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS
          path: build/Horizon-unsigned.ipa