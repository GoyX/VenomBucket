name: Build Horizon iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          
      - name: Build Rust Static Library
        run: |
          cargo build --release --lib --package horizon-client --target aarch64-apple-ios --no-default-features --features audio
          
      - name: Download Game Assets
        run: |
          curl -L -o assets.zip "https://pub-7a7e79921dcf455280d0de7c4a48369f.r2.dev/horizon-assets.zip"
          mkdir -p ios/Resources
          unzip -q assets.zip -d ios/Resources/
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          
      - name: Build Xcode App (Unsigned)
        run: |
          cd ios
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build build
          
      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Horizon.app build/Payload/
          
          # Force inject the Bundle ID and Executable
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier dev.venombucket.client" build/Payload/Horizon.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Horizon" build/Payload/Horizon.app/Info.plist
          
          # Force the Info.plist to be Apple's native binary format (bplist00)
          plutil -convert binary1 build/Payload/Horizon.app/Info.plist
          
          # Overwrite PkgInfo with exact 8 bytes
          echo -n "APPL????" > build/Payload/Horizon.app/PkgInfo
          
          # Set exact permissions (folders 755, plist 644, binary 755)
          find build/Payload -type d -exec chmod 755 {} \;
          find build/Payload -type f -exec chmod 644 {} \;
          chmod 755 build/Payload/Horizon.app/Horizon
          
          # FIX: Strip all Mac extended attributes (xattr) which corrupt Windows sideloaders
          xattr -cr build/Payload
          
          # Verify the plist one last time
          echo "--- VERIFYING INFO.PLIST ---"
          plutil -p build/Payload/Horizon.app/Info.plist
          echo "----------------------------"
          
          cd build
          # Use ditto (Apple's native tool) to package the IPA perfectly
          ditto -c -k --sequesterRsrc --keepParent Payload Horizon-unsigned.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS
          path: build/Horizon-unsigned.ipa