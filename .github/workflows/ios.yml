name: Build Horizon iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          
      - name: Build Rust Static Library
        run: |
          cargo build --release --lib --package horizon-client --target aarch64-apple-ios --no-default-features --features audio
          
      - name: Download Game Assets
        run: |
          curl -L -o assets.zip "https://pub-7a7e79921dcf455280d0de7c4a48369f.r2.dev/horizon-assets.zip"
          mkdir -p ios/Resources
          unzip -q assets.zip -d ios/Resources/
          
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          
      - name: Build Xcode App (Unsigned)
        run: |
          cd ios
          xcodebuild -project Horizon.xcodeproj -scheme Horizon -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -derivedDataPath ./build build
          
      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/Horizon.app build/Payload/
          
          # Force inject the Bundle ID and Executable name to guarantee iOS can read it
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier dev.venombucket.client" build/Payload/Horizon.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable Horizon" build/Payload/Horizon.app/Info.plist
          
          # Ensure the binary has execute permissions
          chmod +x build/Payload/Horizon.app/Horizon
          
          cd build
          # Use ditto instead of zip (Apple's native tool that preserves iOS permissions perfectly)
          ditto -c -k --sequesterRsrc --keepParent Payload Horizon-unsigned.ipa
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horizon-iOS
          path: build/Horizon-unsigned.ipa